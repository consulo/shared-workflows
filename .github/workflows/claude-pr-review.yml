name: Claude PR Review (reusable)

# Reusable workflow. Consumers trigger on issue_comment /
# pull_request_review_comment and call this via `uses:`. A called workflow
# inherits the caller's github.event, so the comment payload is available here.
on:
    workflow_call:
        inputs:
            authorized_users:
                description: 'GitHub logins allowed to trigger reviews (case-insensitive, separated by space/comma/newline)'
                type: string
                default: vistall unv-unv
            model:
                description: 'Claude model'
                type: string
                default: claude-opus-4-8
        secrets:
            ANTHROPIC_API_KEY:
                required: true

jobs:
    # Gate everything behind an author check so only the authorized user can spend
    # tokens / trigger Claude. Comparison is case-insensitive.
    authorize:
        # Order matters: a pull_request_review_comment payload has NO `github.event.issue`,
        # so `github.event.issue.pull_request` must be guarded by an event-name check that
        # is evaluated FIRST. Putting the issue_comment branch first made the job fail at
        # init on inline-thread replies (authorize errored before any step ran, so the run
        # died silently and nothing was ever posted back).
        if: |
            github.repository_owner == 'consulo' &&
            (
              github.event_name == 'pull_request_review_comment' ||
              (github.event_name == 'issue_comment' && github.event.issue.pull_request != null)
            ) &&
            contains(github.event.comment.body, '@claude')
        runs-on: ubuntu-latest
        outputs:
            ok: ${{ steps.check.outputs.ok }}
        steps:
            -   id: check
                env:
                    # Passed via env to avoid script injection from the comment payload.
                    LOGIN: ${{ github.event.comment.user.login }}
                    ALLOWED: ${{ inputs.authorized_users }}
                run: |
                    login_lc="${LOGIN,,}"
                    ok=false
                    # Accept space-, comma- or newline-separated lists.
                    for u in $(printf '%s' "$ALLOWED" | tr ',\n' '  '); do
                      if [ "${u,,}" = "$login_lc" ]; then
                        ok=true
                        break
                      fi
                    done
                    echo "ok=$ok" >> "$GITHUB_OUTPUT"
                    [ "$ok" = "true" ] || echo "Ignoring @claude from '$LOGIN' (authorized: $ALLOWED)."

    review:
        needs: authorize
        if: needs.authorize.outputs.ok == 'true'
        runs-on: ubuntu-latest
        steps:
            # In tag mode (forced by track_progress below) claude-code-action checks
            # out the PR branch itself — including fork PRs via refs/pull/N/head — so we
            # only provide a base checkout for it to operate in. Do NOT add a manual
            # `gh pr checkout` here: it leaves HEAD on the PR branch and the action's
            # own `git fetch … pull/N/head:<branch>` then fails with "refusing to fetch
            # into branch checked out".
            -   name: Checkout base
                uses: actions/checkout@v5
                with:
                    fetch-depth: 0

            -   name: Run Claude
                uses: anthropics/claude-code-action@v1
                env:
                    ANTHROPIC_MODEL: ${{ inputs.model }}
                    # The action wraps every Bash subprocess in a bwrap sandbox that
                    # creates "$HOME/.mcp.json". On this runner HOME resolves to an
                    # unwritable "/home" INSIDE the sandbox, so bwrap fails to init with
                    # "Can't create file at /home/.mcp.json: Permission denied" and EVERY
                    # shell command dies — including the `gh api` calls that post inline
                    # review comments. Overriding HOME does not help (the sandbox resets
                    # it internally). The action exposes an opt-out: when this var is "0"
                    # it skips the subprocess isolation wrapper entirely, which is what we
                    # need so `gh`/`gh api` run normally. Trade-off: credentials are no
                    # longer scrubbed from subprocess envs, which is acceptable here since
                    # the run is gated to authorized maintainers and tools are restricted
                    # to gh/Read/Grep/Glob below.
                    CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "0"
                with:
                    claude_code_oauth_token: ${{ secrets.ANTHROPIC_API_KEY }}
                    github_token: ${{ secrets.GITHUB_TOKEN }}
                    # The action otherwise requires the commenter to have *write* access.
                    # Our authorize job already gates this run to inputs.authorized_users
                    # before we get here, so '*' just defers to that allowlist and lets
                    # read-only collaborators (who are on the allowlist) trigger reviews.
                    allowed_non_write_users: '*'
                    # Auto-install the shared Consulo skills as a plugin marketplace.
                    plugin_marketplaces: |
                        https://github.com/consulo/claude-skills.git
                    plugins: |
                        consulo-skills@consulo
                    # Post one tracking comment at start and keep editing it in place with a
                    # live checklist as each step completes. Forces tag mode even though we
                    # pass a custom prompt below.
                    track_progress: true
                    # The full comment is forwarded verbatim as the instruction. Only the
                    # authorized user can reach this point, so the trusted-input assumption holds.
                    prompt: |
                        REPO: ${{ github.repository }}
                        PR NUMBER: ${{ github.event_name == 'pull_request_review_comment' && github.event.pull_request.number || github.event.issue.number }}

                        The maintainer left this comment on the PR — follow it exactly:
                        ---
                        ${{ github.event.comment.body }}
                        ---

                        The working tree is checked out at the PR head.

                        INLINE THREAD CONTEXT (set only when this run was triggered from a
                        reply inside an existing inline review comment thread — e.g. a reply
                        on a ```suggestion block you posted earlier). Empty for top-level
                        PR comments:
                          FILE:         ${{ github.event.comment.path }}
                          LINE:         ${{ github.event.comment.line }}
                          COMMENT ID:   ${{ github.event.comment.id }}
                          IN REPLY TO:  ${{ github.event.comment.in_reply_to_id }}
                          DIFF HUNK:
                          ${{ github.event.comment.diff_hunk }}

                        If FILE above is non-empty, treat this as a follow-up ON that inline
                        thread, not a new review:
                          1. Read the whole thread so you have the full back-and-forth:
                             `gh api repos/${{ github.repository }}/pulls/<PR NUMBER>/comments`
                             and follow the `in_reply_to_id` chain for this thread (and the
                             original comment you posted, which usually holds the suggestion).
                          2. Open FILE at LINE in the checked-out tree and address exactly what
                             the reply asks.
                          3. Reply IN THE SAME THREAD (do NOT open a separate top-level comment):
                             `gh api --method POST \
                               repos/${{ github.repository }}/pulls/<PR NUMBER>/comments/${{ github.event.comment.id }}/replies \
                               -f body='<your reply>'`
                             If a code change is warranted, put an updated ```suggestion block
                             in that reply body so the author can apply it in one click.
                          Then stop — do not also run a full-PR review.

                        Otherwise (FILE is empty): if the comment asks to "review with inline
                        comments" (or otherwise requests inline feedback), create inline review
                        comments on the specific lines and express each actionable change as a
                        GitHub ```suggestion block so the author can apply it with one click. Use
                        `gh api` against the PR review-comments endpoint to attach a comment
                        to a file + line, with the body containing the suggestion block.

                        Otherwise, post your response as a single PR comment with
                        `gh pr comment`.
                    claude_args: |
                        --allowedTools "Bash(gh pr comment:*),Bash(gh pr review:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),Read,Grep,Glob"
